name: Flutter Package Workflow

on:
  workflow_call:
    inputs:
      analyze_directories:
        required: false
        type: string
        default: "lib test"
      concurrency:
        required: false
        type: number
        default: 4
      coverage_excludes:
        required: false
        type: string
        default: ""
      flutter_channel:
        required: false
        type: string
        default: "stable"
      flutter_version:
        required: false
        type: string
        default: ""
      format_directories:
        required: false
        type: string
        default: "lib test"
      format_line_length:
        required: false
        type: string
        default: "80"
      min_coverage:
        required: false
        type: number
        default: 100
      runs_on:
        required: false
        type: string
        default: "ubuntu-latest"
      setup:
        required: false
        type: string
        default: ""
      test_optimization:
        required: false
        type: boolean
        default: true
      test_recursion:
        required: false
        type: boolean
        default: false
      working_directory:
        required: false
        type: string
        default: "."
      package_get_excludes:
        required: false
        type: string
        default: "!*"
      test_directory:
        required: false
        type: string
        default: "test"
    secrets:
      ssh_key:
        required: false

jobs:
  build:
    defaults:
      run:
        working-directory: ${{inputs.working_directory}}

    runs-on: ${{inputs.runs_on}}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{inputs.flutter_version}}
          channel: ${{inputs.flutter_channel}}
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 🤫 Set SSH Key
        env:
          ssh_key: ${{secrets.ssh_key}}
        if: env.ssh_key != null
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{secrets.ssh_key}}

      - name: 📦 Install Dependencies
        run: |
          flutter pub global activate very_good_cli
          flutter pub get
          #very_good packages get --recursive --ignore=${{inputs.package_get_excludes}}

      - name: ⚙️ Run Setup
        if: "${{inputs.setup != ''}}"
        run: ${{inputs.setup}}

      - name: ✨ Check Formatting
        run: dart format --line-length ${{inputs.format_line_length}} --set-exit-if-changed ${{inputs.format_directories}}

      - name: 🕵️ Analyze
        run: flutter analyze ${{inputs.analyze_directories}}

      - name: 🧪 Run Tests
        run: flutter test ${{inputs.test_directory}} --coverage --test-randomize-ordering-seed random
        #run: very_good test -j ${{inputs.concurrency}} ${{(inputs.test_recursion && '--recursive') || ''}} ${{(inputs.test_optimization && '--optimization') || '--no-optimization'}} --coverage --test-randomize-ordering-seed random

      - name: Publish dry run
        if: ${{ github.ref == 'refs/heads/main' }}
        run: dart pub publish --dry-run

      - name: Install pana
        run: dart pub global activate pana

      - name: Verify code metrics
        run: |
          echo "# Pana report" >> $GITHUB_STEP_SUMMARY
          $HOME/.pub-cache/bin/pana >> $GITHUB_STEP_SUMMARY
          if ! grep -q 'API elements (100.0 %) have documentation comments.' $GITHUB_STEP_SUMMARY; then
            echo "Documentation coverage is not 100%. Please add documentation comments to all public API elements." >&2
            exit 1
          fi
          if ! grep -q 'Points: 160/160.' $GITHUB_STEP_SUMMARY; then
            echo "The score is not the expected 160/160 points. Please check and fix this." >&2
          fi

      # disabled until this works again
      #- name: 📊 Check Code Coverage
      #  uses: VeryGoodOpenSource/very_good_coverage@v3
      #  with:
      #    path: ${{inputs.working_directory}}/coverage/lcov.info
      #    exclude: ${{inputs.coverage_excludes}}
      #    min_coverage: ${{inputs.min_coverage}}

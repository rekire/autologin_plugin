name: autologin_web
description: The platform implementation of the autologin plugin for web.
version: 1.2.0
homepage: https://github.com/rekire/autologin_plugin/tree/main/autologin_web
resolution: workspace

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=1.20.0"

flutter:
  plugin:
    implements: autologin
    platforms:
      web:
        pluginClass: AutologinWeb
        fileName: autologin_web.dart

dependencies:
  autologin: ^1.2.0
  autologin_platform_interface: ^1.2.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ">=5.1.0 <11.0.0"
